[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-agent-client"
version = "0.1.0"
description = "Client Python synchrone/asynchrone pour OpenRouter avec boucle agentique"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1.0,<2", "tomli>=2.0; python_version < '3.11'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
