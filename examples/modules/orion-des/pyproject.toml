[project]
name = "orion-des"
version = "0.1.0"
description = "Un module d'exemple pour Orion : lancer des dés, vraiment au hasard."
requires-python = ">=3.13"
dependencies = []

[project.entry-points."orion.modules"]
des = "orion_des:DesModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orion_des"]
