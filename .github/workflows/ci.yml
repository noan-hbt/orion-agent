name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Compile all Python modules
        shell: bash
        run: python -m compileall -q -f .
      - name: Run offline tests
        env:
          ORION_TEST_OFFLINE: '1'
        run: python -m pytest -q
      - name: Build and inspect wheel
        run: |
          python -m pip install build
          python -m build --wheel --no-isolation
          python -m pip install --force-reinstall dist/*.whl
          orion-toolbox --help
      - name: Optional lint
        shell: bash
        run: |
          python -m pip install ruff || true
          python -m ruff check . || true
