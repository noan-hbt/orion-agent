name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Bounds a hung test run.  Several tests use unbounded blocking waits
    # (bare thread.join(), readline() on a sleeping child), so without this a
    # single stall could occupy the default 360-minute budget on all 8 jobs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile all Python modules
        shell: bash
        run: python -m compileall -q -f . -x '(^|[\\/])(build|dist|\.venv)([\\/]|$)'
      - name: Run offline tests
        env:
          ORION_TEST_OFFLINE: '1'
        run: python -m pytest -q
      - name: Build and inspect wheel
        run: |
          python -m build --wheel --no-isolation
          python -m pip install --force-reinstall dist/*.whl
          orion-toolbox --help
      # Lint is a gate, not advice.  It previously ended with `|| true`, so the
      # job passed regardless of findings.  The rule set is defined in
      # pyproject.toml ([tool.ruff.lint]).
      - name: Lint
        run: python -m ruff check .
