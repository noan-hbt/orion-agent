id = "orion.web"
name = "Web"
version = "1.3.0"
description = "Tool web unifié pour rechercher et lire des ressources publiques en lecture seule."
entrypoint = "tool:register"
api_version = 1
permissions = ["network"]

[policy]
classification = "read_only"
tool_classifications = { web = "read_only" }

[guidance]
summary = "Recherche des informations publiques sur le web et lit des pages ou API JSON."
instructions = "Utilise web(action='search', query=...) pour rechercher, web(action='fetch', url=...) pour lire une page et web(action='json', url=...) pour une API JSON. Distingue clairement les faits sourcés des inférences et cite les sources dans la réponse finale lorsque c'est pertinent."
constraints = [
  "Ne présente pas une information non vérifiée comme certaine.",
  "N'utilise pas ce tool pour accéder à des ressources privées ou contourner un contrôle d'accès."
]

[configuration]
section = "web"

[[configuration.fields]]
key = "provider"
label = "Fournisseur web (auto/tavily/public)"
type = "choice"
choices = ["auto", "tavily", "public"]
default = "auto"

[[configuration.fields]]
key = "api_key"
label = "Clé API Tavily"
type = "secret"
env = "TAVILY_API_KEY"

[[configuration.fields]]
key = "search_depth"
label = "Profondeur Tavily (basic/advanced)"
type = "choice"
choices = ["basic", "advanced"]
default = "basic"

[[configuration.fields]]
key = "topic"
label = "Type de recherche Tavily (general/news/finance)"
type = "choice"
choices = ["general", "news", "finance"]
default = "general"

[[configuration.fields]]
key = "timeout"
label = "Délai maximal par requête (secondes)"
type = "integer"
default = 20
