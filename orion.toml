# Configuration principale d'Orion.
# Les chemins relatifs sont resolus depuis ce fichier.
# Les secrets restent dans .env

[orion]
name = "Orion"
config_version = 2

[gateway]
# Desactive par defaut; les secrets restent dans l'environnement.
enabled = false
host = "127.0.0.1"
port = 8080
path = "/webhook"
max_body_bytes = 262144
queue_size = 1000
request_timeout = 20.0
auth_mode = "token"
auth_token_env = "ORION_GATEWAY_TOKEN"
hmac_secret_env = "ORION_GATEWAY_HMAC_SECRET"
allowlist = []
reply_allowlist = []
allow_redirects = false

[llm]
api_key_env = "OPENROUTER_API_KEY"
model = "openai/gpt-5.6-luna"
base_url = "https://openrouter.ai/api/v1"
timeout = 60.0
max_retries = 3
retry_backoff = 0.5
site_name = "Orion"
# site_url = "https://example.com"

[llm.default_params]
temperature = 0.2

[events]
workers = 1
queue_size = 0
default_max_attempts = 3
retry_delay = 1.0
retry_backoff = 2.0
durable_path = "data/events.sqlite3"

[runtime]
max_deferred_events = 10000
max_turns = 12
wake_queue_size = 0
dedupe_window = 86400.0
parallel_tool_calls = true
# Reçoit les nouveaux événements pendant un RUN et les traite ensuite,
# sans les injecter dans le contexte du RUN courant.
queue_events_during_run = true
wake_on_subagent_progress = false
durable_path = "data/events.sqlite3"

[subagents]
enabled = false
state_path = "data/subagents.json"
workers = 3
default_model = "deepseek/deepseek-v4-flash-0731"
default_tools = []
default_max_turns = 8
max_context_chars = 16000
max_result_chars = 24000
max_tool_output_chars = 12000
max_session_messages = 100
history_limit = 200
emit_progress_events = false

[teams]
# Bus SQLite partage optionnel entre plusieurs processus Orion.
enabled = false
path = "data/teams.sqlite3"
instance_id = "orion"
team = "default"
poll_interval = 1.0
max_message_chars = 12000

[response]
concise = true
max_chars = 1800
max_sentences = 5

[reflection]
# Pre-etape interne, executee avant le premier appel decisionnel du run.
enabled = true
model = "deepseek/deepseek-v4-flash-0731"
prompt_path = "REFLECTION_CORE.md"
max_input_chars = 12000
max_output_chars = 5000
temperature = 0.7

[tasks]
enabled = false
path = "data/tasks.json"

[ledger]
path = "data/action_ledger.sqlite3"

[scheduler]
enabled = false
poll_interval = 1.0
schedules_path = "data/schedules.json"

[channels]
# Les adaptateurs concrets sont enregistres par l'application ou ses plugins.
enabled = ["cli"]
default = "cli"

[channels.cli]
enabled = true
style = true
banner = true
markdown = true
timestamps = true
history_path = "data/cli_history.txt"
# Alerte visuelle si une requête dépasse ce délai ; 0 désactive l'alerte.
slow_request_seconds = 15.0

# Exemples de configuration channel ; les secrets doivent rester dans .env.
# [channels.telegram]
# enabled = true
# token_env = "TELEGRAM_BOT_TOKEN"
# Sécurité : les chats sont refusés par défaut. Définir explicitement
# allow_all_chats = true uniquement pour un bot volontairement ouvert.
# allowed_chat_ids = [123456789]
# allowed_user_ids = []
# outbound_allowed_chat_ids = [123456789]
# allow_all_chats = false
# Premier message autorisé comme bootstrap et mémorisé durablement.
# bootstrap_owner = true
# owner_path = "data/telegram.owner"
# accept_edited = false
# offset_path = "data/telegram.offset"
# poll_timeout = 25
# parse_mode = "HTML"
# max_message_chars = 3500
# max_retries = 3
# retry_backoff = 0.5
# retry_max_delay = 30.0
# queue_size = 1000
#
# [channels.email]
# enabled = true
# imap_host = "imap.example.com"
# smtp_host = "smtp.example.com"
# username = "orion@example.com"
# password_env = "EMAIL_PASSWORD"
# mailbox = "INBOX"
# poll_interval = 60.0
#
# [channels.discord]
# enabled = true
# webhook_url_env = "DISCORD_WEBHOOK_URL"
#
# [channels.web]
# enabled = true
# host = "127.0.0.1"
# port = 8080
# path = "/webhook"
# auth_token_env = "ORION_WEBHOOK_TOKEN"
# outbound_url_env = "ORION_WEBHOOK_REPLY_URL"

[prompt]
core_path = "ORION_CORE.md"
context_path = "data/prompt_context.json"
journal_path = "data/conversations.jsonl"
history_enabled = true
history_limit = 2000
history_max_chars = 140000
# Ces champs sont optionnels. La personnalite et la methodologie peuvent aussi
# etre conservees dans data/prompt_context.json.
# personality = "Tu es Orion : fiable, calme, pragmatique et direct."
# methodology = "Comprendre, charger l'etat utile, decider, agir ou attendre, puis mettre a jour l'etat."
additional = ""

[context]
context_contract_version = "v1"
context_mode = "contract"
compaction_enabled = true
llm_compaction_enabled = false
compactor_model = "deepseek/deepseek-v4-flash-0731"
total_max_chars = 200000
total_max_tokens = 48000
output_reserve_tokens = 3000
compactor_input_chars = 30000
cache_size = 64
task_max_chars = 12000
task_max_tokens = 3000
event_max_chars = 10000
event_max_tokens = 3000
history_max_chars = 140000
history_max_tokens = 30000
policy_max_chars = 12000
policy_max_tokens = 3000
request_max_chars = 8000
request_max_tokens = 2000
profile_memory_max_chars = 4000
profile_memory_max_tokens = 1000
notifications_tools_max_chars = 8000
notifications_tools_max_tokens = 2000
reflection_max_chars = 2000
reflection_max_tokens = 500
history_turn_limit = 2000
reflection_enabled = true
reflection_format = "advisory_json"
redaction_enabled = true
token_counter = "fallback"

[memory]
# La maintenance est volontairement configurable et peut etre desactivee.
enabled = false
model = "deepseek/deepseek-v4-flash-0731"
run_at = "23:00"
batch_size = 20
min_entries = 20
poll_interval = 30.0
max_input_chars = 30000

[context_os]
# Durable context control plane. Disabled preserves the historical JSONL setup.
enabled = false
registry_path = "data/context_registry.sqlite3"
journal_enabled = false
journal_path = "data/context_journal.sqlite3"
memory_path = "data/memory.sqlite3"
memory_namespace = "default"
state_path = "data/thread_state.json"

[tools]
# Les paquets sont installes dans ce dossier et charges au demarrage.
directory = "tools"
state_path = "data/installed_tools.json"
# Orion démarre sans capability optionnelle. Les tools et modules bundled
# (orion.web, orion.files, orion.tasks, orion.subagents, orion.team, etc.)
# doivent être activés explicitement via la toolbox.
enabled = []
disabled = []

[tools.policy]
# Défense en profondeur côté opérateur. Une classification déclarée ici peut
# renforcer un manifest mais ne peut jamais abaisser son niveau de risque.
privileged = ["terminal"]

[tools.terminal]
# Le terminal travaille dans le projet par défaut.
max_timeout = 120
max_output_chars = 12000
allow_outside_root = false

[tools.web]
# auto est résolu par Orion avant le chargement du plugin : Tavily si
# TAVILY_API_KEY existe, sinon recherche HTTP publique. Selenium/Chrome n'est
# utilisé que si provider = "browser" est demandé explicitement.
provider = "auto"
api_provider = "tavily"
api_key_env = "TAVILY_API_KEY"
api_url = "https://api.tavily.com/search"
search_depth = "basic"
topic = "general"
timeout = 20
max_results = 8
max_chars = 16000
max_bytes = 2000000
max_search_bytes = 1500000
search_engines = ["bing_rss", "duckduckgo_html", "duckduckgo_lite"]
cache_ttl = 300
cache_size = 128
allow_private = false

[tools.files]
max_read_chars = 40000
max_file_bytes = 2000000

[tools.github]
# Dépôt utilisé par python orion_toolbox.py si --repo n'est pas fourni.
repo = "noan-hbt/orion-tools"
ref = "main"
timeout = 20
